<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self' 'unsafe-inline' 'unsafe-eval';
        script-src 'self' 'unsafe-inline' 'unsafe-eval'
          https://www.youtube.com
          https://player.vimeo.com
          https://player.twitch.tv
          https://embed.twitch.tv;
        frame-src
          https://www.youtube.com https://*.youtube.com https://*.youtube-nocookie.com
          https://player.vimeo.com
          https://player.twitch.tv https://embed.twitch.tv https://clips.twitch.tv
          https://www.dailymotion.com https://geo.dailymotion.com;
        img-src 'self' data: https:;
        connect-src 'self' https://www.youtube.com https://*.youtube.com
          https://vimeo.com https://player.vimeo.com
          https://*.twitch.tv https://*.ttvnw.net
          https://www.dailymotion.com https://*.dailymotion.com;
        style-src 'self' 'unsafe-inline';
        media-src 'self' https: blob:;
      "
    />
    <title>YTView</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
