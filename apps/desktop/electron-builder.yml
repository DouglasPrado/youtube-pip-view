appId: com.ytview.app
productName: YTView
directories:
  buildResources: build
  # Não pode ser "dist": é lá que o Vite põe o renderer, que entra no pacote.
  # Com os dois no mesmo lugar, cada build empacotava o app anterior dentro
  # do novo (o asar chegou a 258 MB).
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - assets/**/*
extraMetadata:
  main: dist-electron/electron-loader.cjs
icon: build/icon.png
mac:
  category: public.app-category.entertainment
  icon: build/icon.png
  target:
    - dmg
    - zip
dmg:
  title: ${productName}-${version}
win:
  icon: build/icon.png
  target:
    - nsis
    - portable
linux:
  icon: build/icon.png
  category: AudioVideo
  target:
    - AppImage
    - deb
